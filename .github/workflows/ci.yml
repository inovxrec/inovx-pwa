name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - integration
      - 'Foundation-&-integration'
  push:
    branches:
      - 'Foundation-&-integration'
      - integration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck & Build (tsc + vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ljtreitmsvzseqspiocq.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_4n4BGSnpQV_70Nc7IEWK9Q_VlJ5vXqP
