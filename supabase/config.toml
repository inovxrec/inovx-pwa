# Supabase configuration for InovX Ops
project_id = "ljtreitmsvzseqspiocq"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# seed.sql builds the club; seed_local_auth.sql gives it accounts that can sign
# in. The order matters — the auth rows reuse the profile ids from seed.sql.
[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_local_auth.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# The frontend talks to exactly four services: db, auth, rest and the kong
# gateway in front of them. It subscribes to no realtime channel, uploads to no
# bucket, and invokes no edge function — grep the src tree and you will find
# none of them. Everything below is a developer convenience, and on a 16GB
# machine already running Docker the full stack leaves under a gigabyte free,
# which shows up as auth timeouts and "Database connection error" rather than as
# anything that names memory. Turn one back on when you actually want it.
[studio]
enabled = false
port = 54323

[auth]
enabled = true
# Where the app actually is. `config push` sends this to the hosted project, so
# a literal localhost here would put localhost links in every password reset
# email the club receives. Driven by the environment so the same file is correct
# locally and hosted:
#
#   SUPABASE_AUTH_SITE_URL=https://inovx.vercel.app npx supabase config push
site_url = "env(SUPABASE_AUTH_SITE_URL)"
# The reset link lands on /first-run, which is already the screen that sets a
# password. Both ports are here because push only works on a production build.
additional_redirect_urls = [
  "http://localhost:5173/first-run",
  "http://localhost:4173/first-run",
  "env(SUPABASE_AUTH_REDIRECT_URL)",
  # Set by hand in the dashboard before this file grew an SMTP block; listed
  # here so `config push` does not drop it.
  "https://inovx-ops.pages.dev/**",
]
jwt_expiry = 3600
enable_signup = false

# Locally, mail goes to Mailpit at http://localhost:54324 and never leaves the
# machine — open it to read a reset link during development.
#
# Hosted, mail goes through Google, and the reason is DNS rather than taste:
#
#   rajalakshmi.edu.in        v=spf1 include:_spf.google.com ~all
#   _dmarc.rajalakshmi.edu.in v=DMARC1; p=reject; pct=100; adkim=s; aspf=s
#
# The college publishes DMARC at p=reject with strict alignment, and authorises
# only Google to send as the domain. A third-party relay — Brevo, Mailjet,
# SendGrid, any of them — can accept our message and will still have it refused
# at delivery, because every recipient is on Google Workspace and honours that
# policy. Brevo was configured here first and was rejected earlier still, for an
# unactivated account; fixing that would only have moved the failure later.
#
# Sending as the club's own Google mailbox satisfies SPF and DKIM without a
# single DNS change, signs with Google's key, and allows ~2000 messages a day
# against the roughly 80 this club could ever need.
#
# The app password is read from the environment and never committed. It is not
# the mailbox password: it is issued per application at
# https://myaccount.google.com/apppasswords and needs 2-Step Verification on
# that account.
#
#   SUPABASE_AUTH_SITE_URL=https://<the hosted app>
#   SUPABASE_AUTH_REDIRECT_URL=https://<the hosted app>/first-run
#   GMAIL_APP_PASSWORD=<the 16-character app password>
#   npx supabase config push

[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "inovx@rajalakshmi.edu.in"
pass = "env(GMAIL_APP_PASSWORD)"
# Google will only send as the authenticated mailbox or a verified alias, so
# these two are the same address by necessity, not by convention.
admin_email = "inovx@rajalakshmi.edu.in"
sender_name = "INOVX Ops"

# Supabase ships 30 auth emails an hour, which is fine for a trickle and wrong
# for onboarding day: 39 people asked to set a password on the same afternoon
# would see the 31st onward refused, and a member told to "try again later" by a
# club app does not try again. Google's own allowance is ~2000 a day, so the
# ceiling that matters is far above this number.
#
# 150 leaves room for retries, a forwarded link, and someone clicking twice,
# while still being low enough that a loop or an abusive script hits a wall.
# A recovery link is how everyone gets in for the first time, so it has to
# outlive a lecture, a commute and a night's sleep. Supabase's default hour is
# sized for a person actively resetting a forgotten password, not for a club
# emailed at once. 24 hours is the maximum the API accepts.
[auth.email]
otp_expiry = 86400

[auth.rate_limit]
email_sent = 150

[functions.bulk-import-members]
verify_jwt = true

# Logflare is a log explorer for Studio, not something the app talks to, and it
# is the heaviest container in the stack — on a machine already running other
# projects it loses its health check and takes Studio down with it. Off by
# default; turn it back on if you actually want the log explorer.
[analytics]
enabled = false

[storage]
# no bucket is read or written
enabled = false

[realtime]
# nothing subscribes to a channel
enabled = false

[edge_runtime]
# On for send-push, which the notifications trigger calls. Turn it off again if
# the stack is short of memory and push is not being worked on.
enabled = true

[functions.send-push]
# Called by a database trigger with the service role key, not by a browser.
verify_jwt = true

